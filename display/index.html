<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Display · SouPlenus</title>
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css?v=157" />
  </head>
  <body>
    <div class="app">
      <!-- ícone à esquerda, relógio e data à direita e, no meio, as salas -->
      <header class="header">
        <img class="logo" src="assets/logo-display-icon.svg" alt="SouPlenus" />

        <!-- quem está em cada sala AGORA -->
        <section class="rooms">
          <div id="rooms"></div>
        </section>

        <div class="header__right">
          <div id="date"></div>
          <div id="clock">--:--</div>
          <div id="status" class="status" hidden></div>
        </div>
      </header>

      <main class="main">
        <!-- lista rolando: só o que ainda vai começar -->
        <section class="agenda">
          <div class="agenda__scroll" id="list"></div>
        </section>
      </main>
    </div>

    <!-- pedido de acesso: aparece só quando o dispositivo ainda não foi configurado -->
    <div class="login" id="login" hidden>
      <div class="login__head">
        <img
          class="login__logo"
          src="assets/logo-display.svg"
          alt="SouPlenus"
        />
        <div class="login__title">Painel da recepção</div>
      </div>

      <form class="login__box" id="login-form">
        <label class="login__field">
          <span>E-mail</span>
          <input
            type="email"
            id="login-email"
            autocomplete="username"
            required
          />
        </label>

        <label class="login__field">
          <span>Senha</span>
          <input
            type="password"
            id="login-password"
            autocomplete="current-password"
            required
          />
        </label>

        <div class="login__error" id="login-error" hidden></div>
        <button class="login__submit" type="submit" id="login-submit">
          Entrar
        </button>
      </form>
    </div>

    <!-- credenciais locais, fora do Git; ausente em produção (404 esperado) -->
    <script src="config.local.js" onerror="void 0"></script>
    <script src="config.js?v=157"></script>
    <script src="mock.js?v=157"></script>
    <script src="app.js?v=157"></script>
  </body>
</html>
