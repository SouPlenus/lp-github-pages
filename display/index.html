<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendamentos de hoje · SouPlenus</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header__left">
        <div class="header__title">Agendamentos de hoje</div>
        <div class="header__sub">Em caso de divergência, consulte a recepção.</div>
      </div>
      <img class="logo" src="assets/logo-display.svg" alt="SouPlenus">
      <div class="header__right">
        <div class="header__meta">
          <div id="date"></div>
          <div id="status" class="status">Carregando…</div>
        </div>
        <div id="clock">--:--</div>
      </div>
    </header>

    <main class="main">
      <section class="agenda">
        <div class="agenda__scroll" id="list"></div>
      </section>

      <section class="rooms">
        <div id="rooms"></div>
      </section>
    </main>
  </div>

  <!-- pedido de acesso: aparece só quando o dispositivo ainda não foi configurado -->
  <div class="login" id="login" hidden>
    <form class="login__box" id="login-form">
      <img class="login__logo" src="assets/logo-display.svg" alt="SouPlenus">
      <div class="login__title">Painel da recepção</div>
      <div class="login__sub">Entre uma vez: o acesso fica salvo neste dispositivo.</div>

      <label class="login__field">
        <span>E-mail</span>
        <input type="email" id="login-email" autocomplete="username" required>
      </label>

      <label class="login__field">
        <span>Senha</span>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </label>

      <div class="login__error" id="login-error" hidden></div>
      <button class="login__submit" type="submit" id="login-submit">Entrar</button>
    </form>
  </div>

  <!-- credenciais locais, fora do Git; ausente em produção (404 esperado) -->
  <script src="config.local.js" onerror="void 0"></script>
  <script src="config.js?v=3"></script>
  <script src="mock.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
